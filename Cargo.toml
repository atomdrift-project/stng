[package]
name = "stng"
version = "1.5.1"
edition = "2024"
authors = ["The Atomdrift Project"]
description = "Language-aware advanced string extraction binaries"
license = "Apache-2.0"
readme = "README.md"
repository = "https://codeberg.org/atomdrift/stng"
keywords = ["binary", "strings", "go", "rust", "reverse-engineering"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Binary parsing
goblin = "0.10"

# Pattern matching
regex = "1.12"

# Parallelism
rayon = "1.12"

# Fast byte scanning
memchr = "2.8"

# Multi-pattern matching
aho-corasick = "1.1"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Serialization (for JSON output)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 decoding
base64 = "0.22"

# Hex decoding
hex = "0.4"

# URL decoding
urlencoding = "2.1"

# Zlib/gzip decompression (for script deobfuscation)
flate2 = "1.1"

# Base32/Base85 encoding
data-encoding = "2.11"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Hashing
sha2 = { version = "0.10", features = ["asm"] }

# x86-64 instruction decoding (for garble emulation)
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }

# OS-appropriate paths (cache directories)
dirs = "6.0"

# Logging (modern structured logging with tracing)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Terminal utilities
terminal_size = "0.4"

# Use jemalloc on unix systems where it isn't already the system allocator.
# FreeBSD/DragonFlyBSD ship jemalloc as the default; bundling a second copy
# causes TSD assertion failures in jails. OpenBSD's jemalloc version string
# format is incompatible with tikv-jemalloc-sys's configure script. illumos
# and Solaris ship libumem (a comparable arena allocator).
[target.'cfg(all(unix, not(any(target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "illumos", target_os = "solaris"))))'.dependencies]
tikv-jemallocator = "0.6"

[features]
# Enables jemalloc heap profiling. Build with:
#   cargo build --profile profiling --features jemalloc-prof --bin stng
# Run with (note the `_RJEM_` prefix — tikv-jemalloc renames MALLOC_CONF):
#   _RJEM_MALLOC_CONF="prof:true,prof_active:true,prof_final:true,lg_prof_interval:28,prof_prefix:out/heap/jeprof" \
#     out/stng.heap <path>
jemalloc-prof = ["tikv-jemallocator/profiling"]

[lib]
name = "stng"
path = "src/lib.rs"

[[bin]]
name = "stng"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
debug = true

# Optimize test binaries. The crate's hot paths (byte scanning, XOR detection,
# string validation) are ~5x slower at opt-level=0 and dominate test runtime,
# so `cargo test` at -O0 takes ~95s versus ~17s with opt-level=2.
[profile.test]
opt-level = 2

[profile.profiling]
inherits = "release"
strip = "none"
debug = 2

[lints.rust]
# Forbid unsafe code entirely
unsafe_code = "forbid"

# Deny these - they catch real bugs
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

# Catch silent no-ops and dead code
noop_method_call = "warn"
dead_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
# Correctness - these catch real bugs
correctness = { level = "deny", priority = -1 }

# Suspicious patterns - likely bugs
suspicious = { level = "warn", priority = -1 }

# Performance - real performance issues
perf = { level = "warn", priority = -1 }

# Style and complexity (inherited from cleave/litmus)
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }

# Panic/unwrap — warn so authors must justify; static LazyLock inits get #[allow]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"

# Error handling — silence is a bug
map_err_ignore = "warn"      # .map_err(|_| ..) silently drops error context
result_unit_err = "deny"     # Result<T, ()> is always a design mistake
result_large_err = "deny"    # large error types bloat Result on the happy path

# Production hygiene
dbg_macro = "deny"           # dbg!() is never intentional in production

# Memory/Resource issues
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
large_futures = "warn"

# Logic errors
debug_assert_with_mut_call = "deny"
exit = "warn"

# Cast safety — inherited from litmus; catch silent data loss on narrowing/sign-changing casts
cast_possible_truncation = "warn"   # e.g. u64 as u32 may silently drop high bits
cast_sign_loss = "warn"             # e.g. -1i64 as usize wraps to usize::MAX

# API design
missing_errors_doc = "allow"        # Too noisy for internal APIs
missing_panics_doc = "allow"        # Too noisy for internal APIs
must_use_candidate = "warn"         # functions returning values callers should not ignore
unnecessary_wraps = "warn"          # fn that always returns Ok/Some should not wrap
needless_pass_by_value = "warn"     # take &T not T when ownership isn't needed
wildcard_imports = "warn"           # explicit imports prevent name-collision surprises

# Style - pragmatic picks from pedantic
use_self = "warn"                        # use Self in impl blocks
redundant_closure_for_method_calls = "warn"  # |x| x.foo() → Type::foo
manual_let_else = "warn"                 # match/if-let that diverges → let-else
match_same_arms = "warn"                 # merge identical match arms

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "classify"
harness = false

[[bench]]
name = "extract"
harness = false
