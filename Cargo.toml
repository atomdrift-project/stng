[package]
name = "stng"
version = "3.0.0-beta.1"
edition = "2024"
# Build on any rustc within ~2 releases of current stable; edition 2024 implies
# the MSRV-aware resolver, so this also caps dependency versions.
rust-version = "1.97"
authors = ["The Atomdrift Project"]
description = "strings(1) for malware analysis: decodes obfuscated strings and understands Go and Rust binaries"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/atomdrift-project/stng"
# Distributed from git, not crates.io: the tree-sitter `[patch]` below must
# apply to every build, and Cargo applies patches only from the top-level
# manifest. See README, "Library".
publish = false

[dependencies]
# Binary parsing
goblin = "0.10"
# No `rev`: callers hand stng their own `binform::Binary` values, so they must
# resolve binform from the same source; Cargo treats `git = url` and
# `git = url, rev = …` as different crates. Cargo.lock records the commit.
binform = { git = "https://github.com/atomdrift-project/binform.git", version = "0.9", default-features = false }

# Pattern matching
regex = "1.13"

# Parallelism
rayon = "1.12"

# Fast byte scanning
memchr = "2.8"

# Multi-pattern matching
aho-corasick = "1.1"

# The `stng` command only; see the `cli` feature.
clap = { version = "4.6", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
terminal_size = { version = "0.4", optional = true }

# Serialization (for JSON output)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 decoding
base64 = "0.23"

# SHA-256: Base58Check wallet checksums, and each input's digest in CLI
# output. No `asm` feature: its assembly does not build with MSVC.
sha2 = "0.11"

# DES is used only by the signature-gated legacy ColdFusion template decoder.
des = "0.9"

# Hostname canonicalization and public-suffix validation. `psl` embeds a static
# snapshot, so analysis never performs network I/O and remains reproducible.
idna = "1.1"
psl = "2.1"

# Zlib/gzip decompression (for script deobfuscation)
flate2 = "1.1"

# Syntax-only, bounded constant recovery for obfuscated Lua. No interpreter.
tree-sitter = "0.28"
tree-sitter-lua = "0.5"

# Base32/Base85 encoding
data-encoding = "2.11"

# x86-64 instruction decoding (for garble emulation)
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "intel"] }

# Logging (modern structured logging with tracing)
tracing = "0.1"
# No default features: the `tracing-log` bridge would route goblin's
# per-entry import warnings through us, a CPU livelock on forged import tables.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "smallvec", "std"], optional = true }

# jemalloc where the system allocator is not already jemalloc (the BSDs) or
# libumem (illumos, Solaris), and where tikv-jemalloc-sys builds (not OpenBSD).
[target.'cfg(all(unix, not(any(target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd", target_os = "illumos", target_os = "solaris"))))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true }

[features]
default = ["cli"]
# The `stng` command and what only it needs: argument parsing, logging setup,
# the terminal and jemalloc. Library users turn default
# features off and build none of it.
cli = [
    "dep:clap",
    "dep:anyhow",
    "dep:terminal_size",
    "dep:tracing-subscriber",
    "dep:tikv-jemallocator",
]
# Enables jemalloc heap profiling. Build with:
#   cargo build --profile profiling --features jemalloc-prof --bin stng
# Run with (note the `_RJEM_` prefix — tikv-jemalloc renames MALLOC_CONF):
#   _RJEM_MALLOC_CONF="prof:true,prof_active:true,prof_final:true,lg_prof_interval:28,prof_prefix:out/heap/jeprof" \
#     out/stng.heap <path>
jemalloc-prof = ["cli", "tikv-jemallocator/profiling"]

[lib]
name = "stng"
path = "src/lib.rs"

[[bin]]
name = "stng"
path = "src/main.rs"
required-features = ["cli"]

# Some of these run the `stng` binary.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1

# Distribution profile, used by release.yml for every shipped binary: release,
# with the standard library's debuginfo stripped too.
[profile.release-lto]
inherits = "release"
strip = "debuginfo"

# Optimize test binaries. The crate's hot paths (byte scanning, XOR detection,
# string validation) are ~5x slower at opt-level=0 and dominate test runtime,
# so `cargo test` at -O0 takes ~95s versus ~17s with opt-level=2.
#
# debug-assertions are disabled: the crate forbids unsafe and uses no
# debug_assert!, so std's debug-only precondition checks (firing in the tight
# binary-parsing loops) catch nothing here yet dominate test-profile time.
#
# overflow-checks stay on. Offsets and sizes come from hostile headers, and an
# unchecked `off + len` that wraps in release is exactly the bug class tests
# must catch; intentional wrapping arithmetic says so with `wrapping_*`.
[profile.test]
opt-level = 2
debug-assertions = false
overflow-checks = true

[profile.profiling]
inherits = "release"
strip = "none"
debug = 2

[lints.rust]
# Forbid unsafe code entirely
unsafe_code = "forbid"

# Deny these - they catch real bugs
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

# Every public item says what it is
missing_docs = "warn"

# Catch silent no-ops and dead code
noop_method_call = "warn"
dead_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
# Correctness - these catch real bugs
correctness = { level = "deny", priority = -1 }

# Suspicious patterns - likely bugs
suspicious = { level = "warn", priority = -1 }

# Performance - real performance issues
perf = { level = "warn", priority = -1 }

# Style and complexity
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }

# Panic/unwrap — warn so authors must justify; static LazyLock inits get #[allow]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"

# Error handling — silence is a bug
map_err_ignore = "warn"      # .map_err(|_| ..) silently drops error context
result_unit_err = "deny"     # Result<T, ()> is always a design mistake
result_large_err = "deny"    # large error types bloat Result on the happy path

# Production hygiene
dbg_macro = "deny"           # dbg!() is never intentional in production

# Memory/Resource issues
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
large_futures = "warn"

# Logic errors
debug_assert_with_mut_call = "deny"
exit = "warn"

# Cast safety: catch silent data loss on narrowing or sign-changing casts
cast_possible_truncation = "warn"   # e.g. u64 as u32 may silently drop high bits
cast_sign_loss = "warn"             # e.g. -1i64 as usize wraps to usize::MAX

# API design
missing_errors_doc = "allow"        # Too noisy for internal APIs
missing_panics_doc = "allow"        # Too noisy for internal APIs
must_use_candidate = "warn"         # functions returning values callers should not ignore
unnecessary_wraps = "warn"          # fn that always returns Ok/Some should not wrap
needless_pass_by_value = "warn"     # take &T not T when ownership isn't needed
wildcard_imports = "warn"           # explicit imports prevent name-collision surprises

# Style - pragmatic picks from pedantic
use_self = "warn"                        # use Self in impl blocks
redundant_closure_for_method_calls = "warn"  # |x| x.foo() → Type::foo
manual_let_else = "warn"                 # match/if-let that diverges → let-else
match_same_arms = "warn"                 # merge identical match arms

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "classify"
harness = false

[[bench]]
name = "extract"
harness = false

[[bench]]
name = "corpus"
harness = false

# tree-sitter fork, pinned. stng relies on three of its parser changes, none
# upstream yet: bounded parse-stack growth on deeply ambiguous input, a fix
# for an ambiguous-parse error, and the illumos build. The engine and its
# language ABI must come from the same tree, and Cargo links only one copy.
# Dependents must copy this block; `script::lua` has a test that fails
# without it.
[patch.crates-io]
tree-sitter = { git = "https://github.com/tstromberg/tree-sitter", rev = "10d5d1372be200e04480a6b1d6780229c5b1ee79" }
tree-sitter-language = { git = "https://github.com/tstromberg/tree-sitter", rev = "10d5d1372be200e04480a6b1d6780229c5b1ee79" }

[profile.dev]
# `false` still permits local Thin LTO in optimized crates.
lto = "off"
