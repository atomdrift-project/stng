# cargo-deny: advisories, licences, duplicate/banned crates, and where crates
# may come from. Run with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless listed here with a reason.
ignore = []

[licenses]
# Permissive licences compatible with stng's Apache-2.0, as the dependency
# tree uses them today. MPL-2.0 is file-level copyleft (option-ext, via dirs).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependency (crates/stng-process) is not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# tree-sitter is patched to a fork (Cargo.toml [patch.crates-io]); the
# lockfile pins the commit. Any other git source is refused.
allow-git = ["https://github.com/tstromberg/tree-sitter"]
