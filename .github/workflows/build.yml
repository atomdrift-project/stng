# Reusable build matrix — the single definition of "what platforms we ship and
# how". Called by ci.yml (`release` profile, ad-hoc macOS signature) and by
# release.yml (`release-lto`, plus whatever signing the `sign`/`notarize` inputs
# ask for). Keeping one matrix means CI and release can't drift into building
# different things.
#
# See ci.yml for the hardening rationale that applies to both callers.

name: build

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to check out. Empty uses the caller's commit; release recovery
          can supply an existing tag while using the repaired workflow from the
          default branch.
        type: string
        default: ""
      target:
        description: >-
          Build only this target during a release recovery. Empty builds the
          complete matrix. Matrix-backed targets run their whole matrix group.
        type: string
        default: ""
      wave:
        description: >-
          Which half of the release matrix to run. `fast` is the native, Windows
          and cross-compiled targets — everything that finishes in roughly half
          an hour. `slow` is the emulated and VM-built platforms, which have
          taken up to 75 minutes. Empty runs both, which is what CI does.
        type: string
        default: ""
      profile:
        description: >-
          Cargo profile: `release` (everyday CI) or `release-lto` (the same
          build with debuginfo stripped, for distribution).
        type: string
        default: release
      sign:
        description: >-
          Sign the macOS binaries with the Developer ID identity. Requires the
          MACOS_CERT_* secrets; falls back to an ad-hoc signature when false.
        type: boolean
        default: false
      notarize:
        description: >-
          Submit the signed binaries to Apple's notary service. Implies `sign`
          and needs the MACOS_NOTARY_* secrets. Off by default: notarization is
          the slowest and most failure-prone step here, and an unnotarized
          build is still perfectly runnable locally — it only costs a Gatekeeper
          prompt on machines that downloaded it.
        type: boolean
        default: false
      require-notarization:
        description: >-
          Require Apple to finish processing before the job succeeds. Release
          publication sets this; dry runs merely prove that Apple accepted the
          upload so a notary-service backlog does not fail unrelated CI.
        type: boolean
        default: false
    secrets:
      MACOS_CERT_P12:
        description: Base64-encoded .p12 holding the Developer ID Application cert + key.
        required: false
      MACOS_CERT_PASSWORD:
        description: Password the .p12 was exported with.
        required: false
      MACOS_NOTARY_KEY:
        description: Base64-encoded App Store Connect API key (.p8).
        required: false
      MACOS_NOTARY_KEY_ID:
        description: App Store Connect key ID.
        required: false
      MACOS_NOTARY_ISSUER:
        description: App Store Connect issuer UUID.
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CROSS_REV: 55f847251389c5406df85579191c0eac412fab3a
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: ${{ matrix.target }}
    if: ${{ (inputs.wave == '' || inputs.wave == 'fast') && (inputs.target == '' || contains(' x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin ', format(' {0} ', inputs.target))) }}
    runs-on: ${{ matrix.os }}
    # A publishing release may spend up to four hours waiting for Apple's
    # asynchronous notary service after the build. Keep the ordinary CI/dry-run
    # ceiling at 150m; those wait only 10m for notarization.
    timeout-minutes: ${{ inputs.require-notarization && 330 || 150 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc floor comes from the runner: 22.04 is glibc 2.35. Bumping to
          # ubuntu-24.04 raises it to 2.39 and silently drops older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
            test: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            native: true

          - target: aarch64-apple-darwin
            os: macos-26
            native: true
            test: true

          # Cross-built on the arm64 runner: the macOS SDK carries both slices,
          # and GitHub is retiring the Intel runners. Build-only — Rosetta is
          # not guaranteed on the arm64 image, so we can't smoke it here.
          - target: x86_64-apple-darwin
            os: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Install target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          rustc --version --verbose

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Registry only, never target/: per-target build dirs would quickly
          # exhaust the 10 GB per-repo cache budget.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-home-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-${{ matrix.target }}-

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: cargo build --locked --profile "$PROFILE" --target "$TARGET" --bin stng

      # Unit and integration tests. Integration tests link as one binary
      # (tests/it) plus hostile_input, which needs a process to itself.
      - name: Test
        if: matrix.test
        run: cargo test --locked

      # --- macOS signing ------------------------------------------------------
      # Unsigned path: an ad-hoc signature, matching what `make release` does on
      # Darwin. Good enough for CI artifacts, useless for distribution.
      - name: Ad-hoc codesign
        if: ${{ runner.os == 'macOS' && !inputs.sign }}
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: codesign --force --sign - "target/$TARGET/$PROFILE/stng"

      # Signed path: import the Developer ID cert into a throwaway keychain
      # that exists only for this job. Never touch the runner's login keychain,
      # and never leave the .p12 on disk.
      - name: Import Developer ID certificate
        if: ${{ runner.os == 'macOS' && inputs.sign }}
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          # Fail with something readable instead of letting `security import`
          # choke on a zero-byte .p12, which is what an unset secret produces.
          if [ -z "$CERT_P12" ]; then
            echo "::error::sign=true but MACOS_CERT_P12 is not set - configure the signing secrets or call this workflow with sign=false"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/atomdrift-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          INTERMEDIATE_G1="$RUNNER_TEMP/DeveloperIDCA-G1.cer"
          INTERMEDIATE_G2="$RUNNER_TEMP/DeveloperIDCA-G2.cer"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ORIGINAL_DEFAULT_KEYCHAIN="$(security default-keychain -d user | \
            sed -e 's/^[[:space:]\"]*//' -e 's/[[:space:]\"]*$//')"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"
          security default-keychain -d user -s "$KEYCHAIN"

          # Import both Apple Developer ID intermediates so certificate
          # rotation between the legacy G1 and current G2 chains is painless.
          # Pin the exact DER bytes because these files affect release trust.
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            --output "$INTERMEDIATE_G1"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$INTERMEDIATE_G2"
          INTERMEDIATE_G1_SHA="$(shasum -a 256 "$INTERMEDIATE_G1" | awk '{print $1}')"
          INTERMEDIATE_G2_SHA="$(shasum -a 256 "$INTERMEDIATE_G2" | awk '{print $1}')"
          if [ "$INTERMEDIATE_G1_SHA" != 7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f ]; then
            echo "::error::Apple Developer ID G1 intermediate checksum mismatch"
            exit 1
          fi
          if [ "$INTERMEDIATE_G2_SHA" != f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a ]; then
            echo "::error::Apple Developer ID G2 intermediate checksum mismatch"
            exit 1
          fi
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Derive the selector before adding the intermediate: the exported
          # .p12 contains one leaf identity, so its certificate fingerprint is
          # unambiguous and does not depend on Keychain common-name indexing.
          SIGNING_IDENTITY="$(security find-certificate -a -Z "$KEYCHAIN" | \
            awk '/SHA-1 hash:/ { print $3 }')"
          IDENTITY_COUNT="$(printf '%s\n' "$SIGNING_IDENTITY" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "$IDENTITY_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one certificate in MACOS_CERT_P12; found $IDENTITY_COUNT"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

          security import "$INTERMEDIATE_G1" -k "$KEYCHAIN"
          security import "$INTERMEDIATE_G2" -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12" "$INTERMEDIATE_G1" "$INTERMEDIATE_G2"

          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend ours to the existing user keychain list. The word splitting
          # is deliberate — each existing keychain has to land as its own
          # argument — and the paths come from `security` itself, not us.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN" || true

      # Signed under the hardened runtime with no entitlements at all, the most
      # restrictive thing codesign will produce. stng only parses bytes, so it
      # has no use for JIT or executable-memory entitlements; never add them —
      # handing a parser the ability to execute what it just read is the
      # capability an attacker would most like it to have.
      - name: Sign with Developer ID
        if: ${{ runner.os == 'macOS' && inputs.sign }}
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -eu
          BIN="target/$TARGET/$PROFILE/stng"
          codesign --force --timestamp --options runtime \
            --sign "$SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign --display --verbose=2 "$BIN"

      - name: Notarize
        if: ${{ runner.os == 'macOS' && inputs.sign && inputs.notarize }}
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          REQUIRE_NOTARIZATION: ${{ inputs.require-notarization }}
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          BIN="target/$TARGET/$PROFILE/stng"
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "::error::notarize=true but one or more MACOS_NOTARY_* secrets are unset"
            exit 1
          fi

          NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8"
          NOTARY_ARCHIVE="$RUNNER_TEMP/stng.zip"
          SUBMIT_RESULT="$RUNNER_TEMP/notary-submit.json"
          STATUS_RESULT="$RUNNER_TEMP/notary-status.json"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$NOTARY_KEY_FILE"
          /usr/bin/ditto -c -k "$BIN" "$NOTARY_ARCHIVE"

          # Submission and processing are separate operations. Keep the UUID
          # so a dropped connection while polling cannot force a second upload.
          submit_attempt=1
          until xcrun notarytool submit "$NOTARY_ARCHIVE" \
            --key "$NOTARY_KEY_FILE" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" \
            --no-wait --output-format json > "$SUBMIT_RESULT"; do
            if [ "$submit_attempt" -ge 3 ]; then
              echo "::error::Apple notarization upload failed after $submit_attempt attempts"
              exit 1
            fi
            echo "::warning::Notarization upload attempt $submit_attempt failed; retrying"
            sleep $((submit_attempt * 30))
            submit_attempt=$((submit_attempt + 1))
          done

          SUBMISSION_ID="$(plutil -extract id raw -o - "$SUBMIT_RESULT")"
          echo "Apple notarization submission: $SUBMISSION_ID"
          {
            echo "### macOS notarization"
            echo
            echo "- Target: \`$TARGET\`"
            echo "- Submission: \`$SUBMISSION_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$REQUIRE_NOTARIZATION" = true ]; then
            wait_timeout=20m
            max_attempts=12
          else
            wait_timeout=10m
            max_attempts=1
          fi

          wait_attempt=1
          while :; do
            rm -f "$STATUS_RESULT"
            wait_rc=0
            xcrun notarytool wait "$SUBMISSION_ID" \
              --key "$NOTARY_KEY_FILE" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER" \
              --timeout "$wait_timeout" \
              --output-format json > "$STATUS_RESULT" || wait_rc=$?

            # A timeout or transient App Store Connect error does not cancel
            # the server-side submission. Query that same UUID before deciding
            # whether to retry or fail.
            if [ "$wait_rc" -ne 0 ]; then
              echo "::warning::Notary wait exited $wait_rc; querying submission $SUBMISSION_ID"
              info_attempt=1
              while ! xcrun notarytool info "$SUBMISSION_ID" \
                --key "$NOTARY_KEY_FILE" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER" \
                --output-format json > "$STATUS_RESULT"; do
                if [ "$info_attempt" -ge 3 ]; then
                  rm -f "$STATUS_RESULT"
                  break
                fi
                sleep $((info_attempt * 15))
                info_attempt=$((info_attempt + 1))
              done
            fi

            status=""
            if [ -s "$STATUS_RESULT" ]; then
              status="$(plutil -extract status raw -o - "$STATUS_RESULT" 2>/dev/null || true)"
            fi
            echo "Notarization status: ${status:-unavailable}"

            case "$status" in
              Accepted)
                echo "- Status: Accepted" >> "$GITHUB_STEP_SUMMARY"
                break
                ;;
              Invalid|Rejected)
                echo "- Status: $status" >> "$GITHUB_STEP_SUMMARY"
                xcrun notarytool log "$SUBMISSION_ID" \
                  --key "$NOTARY_KEY_FILE" \
                  --key-id "$NOTARY_KEY_ID" \
                  --issuer "$NOTARY_ISSUER" || true
                echo "::error::Apple rejected notarization submission $SUBMISSION_ID"
                exit 1
                ;;
              "In Progress"|"") ;;
              *)
                echo "::warning::Unexpected notarization status: $status"
                ;;
            esac

            if [ "$wait_attempt" -ge "$max_attempts" ]; then
              if [ "$REQUIRE_NOTARIZATION" = true ]; then
                echo "- Status: ${status:-Unavailable} (timed out)" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::Notarization submission $SUBMISSION_ID did not finish within the release wait window"
                exit 1
              fi
              echo "- Status: ${status:-Unavailable} (processing continues at Apple)" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Apple accepted submission $SUBMISSION_ID but has not finished processing it; this dry run will continue"
              break
            fi
            wait_attempt=$((wait_attempt + 1))
          done

          rm -f "$NOTARY_KEY_FILE" "$NOTARY_ARCHIVE" "$SUBMIT_RESULT" "$STATUS_RESULT"
          # A bare Mach-O can't be stapled — `stapler` only handles bundles,
          # .dmg and .pkg — so Gatekeeper resolves the ticket online the first
          # time a downloaded copy runs. Ship a signed .pkg if you ever need
          # offline-verifiable direct downloads.

      - name: Remove signing keychain
        if: ${{ always() && runner.os == 'macOS' && inputs.sign }}
        run: |
          set -eu
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/cert.p12" \
            "$RUNNER_TEMP/DeveloperIDCA-G1.cer" \
            "$RUNNER_TEMP/DeveloperIDCA-G2.cer" \
            "$RUNNER_TEMP/notary.p8" \
            "$RUNNER_TEMP/stng.zip" \
            "$RUNNER_TEMP/notary-submit.json" \
            "$RUNNER_TEMP/notary-status.json"
      # ------------------------------------------------------------------------

      - name: Smoke test
        if: matrix.native
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          file "target/$TARGET/$PROFILE/stng"
          "./target/$TARGET/$PROFILE/stng" --version
          "./target/$TARGET/$PROFILE/stng" --help >/dev/null
          # --version and --help touch none of the extraction path, so they
          # pass on a binary that cannot actually read a file. Extract from a
          # real one, after signing, so a broken binary fails the build.
          printf '#!/bin/sh\necho hello-from-the-smoke-test\n' > "$RUNNER_TEMP/smoke.sh"
          "./target/$TARGET/$PROFILE/stng" "$RUNNER_TEMP/smoke.sh" | grep -q hello-from-the-smoke-test

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: tar -czf "stng-$TARGET.tar.gz" -C "target/$TARGET/$PROFILE" stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-${{ matrix.target }}
          path: stng-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The VM jobs below build natively with each OS's packaged rust, which also
  # tells us when that rust drifts below our MSRV. stng is pure Rust apart
  # from jemalloc, which Cargo.toml disables on the BSDs and illumos, so rust
  # is the only package any of them needs. target/ stays out of the synced
  # workspace: the action rsyncs the workspace back to the host afterwards.
  # aarch64 lives in the dispatch-only freebsd-arm64 job below; see its comment
  # for why it is not part of the always-on matrix.
  freebsd:
    name: x86_64-unknown-freebsd
    if: ${{ (inputs.wave == '' || inputs.wave == 'slow') && (inputs.target == '' || inputs.target == 'x86_64-unknown-freebsd') }}
    # Host image is only the VM host here — the compile happens inside the
    # guest against FreeBSD's libc — so the glibc-floor reasoning that pins
    # `native` to 22.04 does not apply. Newer host, newer KVM stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          # Newest stable image the builder publishes, pinned explicitly rather than
          # left to the action's default, since an image that changes under us
          # is an unreviewed dependency.
          #
          # Tradeoff: this was 14.3 so the artifact stayed runnable on 14.x as
          # well as 15.x — FreeBSD binaries run forward across majors, not
          # backward. Building on 15.1 means 15.x only. Drop back to 14.4 if
          # 14.x reach matters more than a current ports rust (which is also
          # what keeps this job's MSRV headroom).
          release: "15.1"
          # Runner is 4 vCPU / 16 GB; leave the host a couple of GB.
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE BUILD_PROFILE"
          prepare: |
            pkg install -y rust
          run: |
            set -eux
            rustc --version
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin stng
            "/tmp/target/$BUILD_PROFILE/stng" --version
            cp "/tmp/target/$BUILD_PROFILE/stng" ./stng
            cargo test --locked --lib
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf stng-x86_64-unknown-freebsd.tar.gz stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-x86_64-unknown-freebsd
          path: stng-x86_64-unknown-freebsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  # aarch64 FreeBSD, dispatch-only (same opt-in pattern as dragonfly/haiku):
  #
  #     gh workflow run release.yml --ref main -f target=aarch64-unknown-freebsd
  #
  # No GitHub-hosted runner can hardware-accelerate an aarch64 guest — the
  # arm64 runner images expose no KVM, and x86_64 KVM cannot run a foreign
  # ISA — so this is pure qemu TCG emulation, an order of magnitude slower
  # than the x86_64 job's ~46 min. An always-on attempt on ubuntu-24.04-arm
  # was removed after still compiling at 2h16m against the 150 min cap.
  # This retry differs in two ways: vmactions documents `arch: aarch64` on
  # the ordinary x86_64 image as the *faster* host ("it's not recommended to
  # use ubuntu-24.04-arm as runner, it's much more slower"), and the timeout
  # sits at the 6 h runner ceiling. Opt-in keeps that cost out of every CI
  # run and release; if a probe run lands comfortably under the cap, adding
  # the target to this job's `if:` default set and release.yml's EXPECTED
  # list promotes it. A green run's stng-* artifact name makes it
  # immediately release-eligible, same as the haiku note below.
  #
  # The last probe (run 31234808876) predates stng's move to a pure-Rust
  # dependency graph and ran out of time compiling C dependencies that are
  # now gone; re-probe before deciding it cannot fit.
  freebsd-arm64:
    name: aarch64-unknown-freebsd
    if: ${{ (inputs.wave == '' || inputs.wave == 'slow') && (inputs.target == 'aarch64-unknown-freebsd') }}
    runs-on: ubuntu-24.04
    # Hosted-runner jobs are killed at 360 minutes regardless of this value;
    # 350 leaves room for packaging and upload after a slow build.
    timeout-minutes: 350
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in FreeBSD aarch64 VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          # Same pin and the same 15.x-only reach tradeoff as the x86_64 job.
          release: "15.1"
          arch: aarch64
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE BUILD_PROFILE"
          prepare: |
            pkg install -y rust
          run: |
            set -eux
            rustc --version
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin stng
            "/tmp/target/$BUILD_PROFILE/stng" --version
            # No `cargo test` here: linking the test binaries under TCG would
            # burn hours of the budget, and the x86_64 job already runs the
            # suite against FreeBSD's libc. Extract from one real file instead.
            printf '#!/bin/sh\necho hello-from-the-smoke-test\n' > /tmp/smoke.sh
            "/tmp/target/$BUILD_PROFILE/stng" /tmp/smoke.sh | grep -q hello-from-the-smoke-test
            cp "/tmp/target/$BUILD_PROFILE/stng" ./stng
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf stng-aarch64-unknown-freebsd.tar.gz stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-aarch64-unknown-freebsd
          path: stng-aarch64-unknown-freebsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  openbsd:
    name: x86_64-unknown-openbsd
    if: ${{ (inputs.wave == '' || inputs.wave == 'slow') && (inputs.target == '' || inputs.target == 'x86_64-unknown-openbsd') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          usesh: true
          # Newest release. OpenBSD makes no cross-release ABI promise, so the
          # artifact is single-release either way; bump with each release
          # (every six months). 7.9 is the first whose rust meets our MSRV.
          release: "7.9"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE BUILD_PROFILE"
          prepare: |
            pkg_add -I rust
          run: |
            set -eux
            # The root login class caps datasize at 4 GiB, below what a fat-LTO
            # link can want. Root may raise its own hard limit.
            ulimit -d unlimited
            rustc --version
            # The default disklabel splits the disk into many small partitions,
            # and the one holding /root is too small for CARGO_HOME. Use
            # whichever mount has the most room.
            df -h
            BIG="$(df -k | awk 'NR > 1 && $4 > max { max = $4; mp = $NF } END { print mp }')"
            echo "cargo scratch on $BIG"
            export CARGO_HOME="$BIG/cargo"
            export CARGO_TARGET_DIR="$BIG/target"
            cargo build --locked --profile "$BUILD_PROFILE" --bin stng
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" ./stng
            cargo test --locked --lib
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf stng-x86_64-unknown-openbsd.tar.gz stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-x86_64-unknown-openbsd
          path: stng-x86_64-unknown-openbsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  netbsd:
    name: x86_64-unknown-netbsd
    if: ${{ (inputs.wave == '' || inputs.wave == 'slow') && (inputs.target == '' || inputs.target == 'x86_64-unknown-netbsd') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in NetBSD VM
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          usesh: true
          release: "11.0"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE BUILD_PROFILE"
          # -u: the image's preinstalled packages trail the live pkgsrc
          # branch, and plain pkg_add refuses to upgrade a dependency in place.
          prepare: |
            /usr/sbin/pkg_add -u rust
          run: |
            set -eux
            rustc --version
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin stng
            "/tmp/target/$BUILD_PROFILE/stng" --version
            cp "/tmp/target/$BUILD_PROFILE/stng" ./stng
            cargo test --locked --lib
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf stng-x86_64-unknown-netbsd.tar.gz stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-x86_64-unknown-netbsd
          path: stng-x86_64-unknown-netbsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  # DragonFlyBSD is a diagnostic target, not part of normal CI or releases.
  # Rust supports it only at Tier 3, and the newest vmactions/DPorts environment
  # currently provides rustc 1.85.1 while Scan requires 1.94. Keep the job
  # available for an explicit compatibility probe when the OS toolchain catches
  # up, without spending runner time or producing a known-missing release asset.
  dragonfly:
    name: x86_64-unknown-dragonfly
    if: ${{ (inputs.wave == '' || inputs.wave == 'slow') && (inputs.target == 'x86_64-unknown-dragonfly') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in DragonFlyBSD VM
        uses: vmactions/dragonflybsd-vm@4ab776fa9f914fbea72f13715b451e77e7ef5c41 # v1.3.4
        with:
          usesh: true
          release: "6.4.2"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE BUILD_PROFILE"
          prepare: |
            pkg install -y rust
          run: |
            set -eux
            rustc --version
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin stng
            "/tmp/target/$BUILD_PROFILE/stng" --version
            cp "/tmp/target/$BUILD_PROFILE/stng" ./stng
            cargo test --locked --lib
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf stng-x86_64-unknown-dragonfly.tar.gz stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-x86_64-unknown-dragonfly
          path: stng-x86_64-unknown-dragonfly.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Haiku and GNU/Hurd have full-std, host-capable rustc targets, but both are
  # Rust Tier 3 and have no official rustup toolchains. Keep these opt-in until
  # a targeted release build proves the native package toolchain and our C/C++
  # dependency graph. If they succeed, their normal stng-* artifact names
  # make them immediately eligible for release publication.
  haiku:
    name: x86_64-unknown-haiku
    if: ${{ (inputs.wave == '' || inputs.wave == 'slow') && (inputs.target == 'x86_64-unknown-haiku') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in Haiku VM
        uses: vmactions/haiku-vm@4d49d1f4d8c265fe5b27c41aa98b7153255d9d4c # v1.1.6
        with:
          release: "r1beta5"
          cpu: "4"
          mem: "12288"
          usesh: true
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE BUILD_PROFILE"
          prepare: |
            # R1/beta5 ships OpenSSL 3.0, while Cargo in rust_bin 1.94.1 was
            # linked against SSL_get0_group_name@OPENSSL_3.2.0. rust_bin's
            # dependency only says libssl >= 3, so package resolution does not
            # otherwise upgrade the satisfied-but-too-old base library.
            pkgman update -y openssl3
            pkgman install -y rust_bin
          run: |
            set -eux
            openssl version
            rustc --version --verbose
            cargo --version --verbose
            df -h . /tmp
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin stng
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" ./stng
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf stng-x86_64-unknown-haiku.tar.gz stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-x86_64-unknown-haiku
          path: stng-x86_64-unknown-haiku.tar.gz
          if-no-files-found: error
          retention-days: 14

  hurd:
    name: x86_64-unknown-hurd-gnu
    if: ${{ (inputs.wave == '' || inputs.wave == 'slow') && (inputs.target == 'x86_64-unknown-hurd-gnu') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in GNU/Hurd VM
        uses: vmactions/hurd-vm@430b769cb10d4019d62abb78fa4c48d29ef51765 # v1.0.2
        with:
          release: "2025"
          cpu: "4"
          mem: "12288"
          usesh: true
          # Keep Cargo's registry and fat-LTO output on the host-backed mount;
          # the Hurd guest image does not have enough disk for both.
          sync: nfs
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE BUILD_PROFILE"
          prepare: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential cargo rustc
            apt-get clean
          run: |
            set -eux
            rustc --version --verbose
            cargo --version --verbose
            df -h . /
            installed="$(rustc --version | awk '{print $2}')"
            if dpkg --compare-versions "$installed" lt 1.94; then
              echo "::error::GNU/Hurd provides rustc $installed; stng requires Rust 1.94 or newer"
              exit 1
            fi
            export CARGO_HOME="$PWD/.native-cargo"
            export CARGO_TARGET_DIR="$PWD/.native-target"
            cargo build --locked --profile "$BUILD_PROFILE" --bin stng
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" ./stng
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf stng-x86_64-unknown-hurd-gnu.tar.gz stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-x86_64-unknown-hurd-gnu
          path: stng-x86_64-unknown-hurd-gnu.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Solaris 11.4. The -gcc image ships the C linker rustc needs.
  solaris:
    name: x86_64-pc-solaris
    if: ${{ (inputs.wave == '' || inputs.wave == 'slow') && (inputs.target == '' || inputs.target == 'x86_64-pc-solaris') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in Solaris VM
        uses: vmactions/solaris-vm@87d3c436511cef802cd1637f86f73b1a97715c8c # v1.4.1
        with:
          release: "11.4-gcc"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE BUILD_PROFILE"
          prepare: |
            set -eux
            # Oracle's IPS ships no rust; use rust-lang's standalone build.
            RUST_VERSION=1.97.1
            TARBALL="rust-${RUST_VERSION}-x86_64-pc-solaris.tar.gz"
            # Solaris tar cannot decompress; pipe through gzip explicitly.
            curl -fsSLO "https://static.rust-lang.org/dist/${TARBALL}"
            gzip -dc "${TARBALL}" | tar xf -
            "./rust-${RUST_VERSION}-x86_64-pc-solaris/install.sh" --prefix=/usr/local --disable-ldconfig
            rm -rf "rust-${RUST_VERSION}-x86_64-pc-solaris" "${TARBALL}"
            # Solaris does not overcommit: fork() reserves backing store for
            # the child's whole address space, so forking gcc out of a large
            # fat-LTO rustc fails with ENOMEM. Back it with a ZFS swap volume.
            /usr/sbin/zpool list rpool
            /usr/sbin/zfs create -V 32G rpool/ci-swap
            /usr/sbin/swap -a /dev/zvol/dsk/rpool/ci-swap
            /usr/sbin/swap -l
          run: |
            set -eux
            PATH="/usr/local/bin:$PATH"
            export PATH
            command -v cargo || { echo "::error::rust install did not put cargo on PATH"; exit 1; }
            rustc --version
            # /tmp is swap-backed tmpfs; /var/tmp is real disk.
            export CARGO_TARGET_DIR=/var/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin stng
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" ./stng
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf stng-x86_64-pc-solaris.tar.gz stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-x86_64-pc-solaris
          path: stng-x86_64-pc-solaris.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Artifact deliberately NOT named stng-x86_64-unknown-illumos: the cross
  # job builds that same target and owns the release-bound name, and
  # upload-artifact rejects a duplicate name within a run. This one is a
  # native-environment check, so its artifact stays outside the `stng-*`
  # pattern release.yml downloads.
  omnios:
    name: x86_64-unknown-illumos (omnios)
    if: ${{ (inputs.wave == '' || inputs.wave == 'slow') && (inputs.target == '' || inputs.target == 'omnios-native') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in OmniOS VM
        uses: vmactions/omnios-vm@9576f0b6d15e7696548409baa533bc0a339caf42 # v1.3.7
        with:
          usesh: true
          release: "r151058"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE BUILD_PROFILE"
          prepare: |
            # rust lives under the extra.omnios publisher (ooce/); gcc is the
            # linker. `pkg list -a '*<name>*'` re-derives the names if an
            # image bump renames them.
            pkg install ooce/developer/rust developer/gcc14
            # Same no-overcommit fork() problem as Solaris; ZFS cannot swap to
            # a regular file, so use a volume.
            /usr/sbin/zpool list rpool
            /usr/sbin/zfs create -V 32G rpool/ci-swap
            /usr/sbin/swap -a /dev/zvol/dsk/rpool/ci-swap
            /usr/sbin/swap -l
          run: |
            set -eux
            rustc --version
            # gcc installs under a versioned prefix that is not on PATH.
            for d in /opt/gcc-*/bin /opt/ooce/gcc-*/bin /usr/gcc/*/bin; do
              [ -x "$d/gcc" ] && PATH="$d:$PATH"
            done
            export PATH
            command -v gcc || { echo "::error::no gcc on PATH"; ls -d /opt/* /usr/gcc/* 2>/dev/null; exit 1; }
            gcc --version | head -1
            # /tmp is swap-backed tmpfs; /var/tmp is real disk.
            export CARGO_TARGET_DIR=/var/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin stng
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/stng" ./stng
            cargo test --locked --lib
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf omnios-native-stng.tar.gz stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnios-native-stng
          path: omnios-native-stng.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Native Windows x86-64 and ARM64 release artifacts, both execution-smoked.
  # GitHub's Windows 11 ARM image ships native Rust, Visual Studio's ARM64 C++
  # tools and the Windows SDK, so native CI covers the C/C++ dependency graph
  # without relying on a cross-link that cannot execute its result.
  windows:
    name: ${{ matrix.target }}
    if: ${{ (inputs.wave == '' || inputs.wave == 'fast') && (inputs.target == '' || contains(' x86_64-pc-windows-msvc aarch64-pc-windows-msvc ', format(' {0} ', inputs.target))) }}
    runs-on: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 150
    permissions:
      contents: read
    # Only `native` (macOS + Linux, arm64/x86-64) is release-blocking; every
    # other target ships when it builds and is reported missing by publish's
    # inventory otherwise. Windows ARM64 is wired up but dispatch-only
    # (`-f target=aarch64-pc-windows-msvc`).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target != '' && format('["{0}"]', inputs.target) || '["x86_64-pc-windows-msvc"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Install target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          rustc --version --verbose

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-home-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-${{ matrix.target }}-

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: cargo build --locked --profile "$PROFILE" --target "$TARGET" --bin stng

      - name: Inspect
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: file "target/$TARGET/$PROFILE/stng.exe"

      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          "./target/$TARGET/$PROFILE/stng.exe" --version
          "./target/$TARGET/$PROFILE/stng.exe" --help >/dev/null

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: tar -czf "stng-$TARGET.tar.gz" -C "target/$TARGET/$PROFILE" stng.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-${{ matrix.target }}
          path: stng-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Targets needing a cross toolchain the runner image doesn't ship. `cross`
  # runs each build in a ghcr.io/cross-rs container, pinned by digest in
  # Cross.toml, and supplies QEMU for the emulated smoke tests.
  cross:
    name: ${{ matrix.target }}
    if: ${{ (inputs.wave == '' || inputs.wave == 'fast') && (inputs.target == '' || contains(' x86_64-unknown-linux-musl aarch64-unknown-linux-musl arm-unknown-linux-musleabihf armv7-unknown-linux-musleabihf loongarch64-unknown-linux-musl x86_64-unknown-illumos s390x-unknown-linux-gnu riscv64gc-unknown-linux-gnu powerpc64le-unknown-linux-gnu ', format(' {0} ', inputs.target))) }}
    # Container builds, so the host's glibc never reaches the artifact — same
    # reasoning as the freebsd job, and unlike `native`.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable Linux artifact: no glibc floor at all. jemalloc still
          # applies, so this doesn't inherit musl-malloc's performance.
          - target: x86_64-unknown-linux-musl
            smoke: true

          # Same artifact for arm64. No smoke test: the runner is x86_64, so
          # there is nothing here that can execute it.
          - target: aarch64-unknown-linux-musl

          # Static ARMv6 hard-float: Raspberry Pi 1/Zero-class systems.
          - target: arm-unknown-linux-musleabihf
            emulated_smoke: true

          # ARMv7-A is still common in routers, cameras, NAS appliances and
          # industrial gateways. The static artifact works on glibc, musl and
          # uClibc userlands that use the standard hard-float ABI.
          - target: armv7-unknown-linux-musleabihf
            emulated_smoke: true

          # LoongArch64 is an edge/server target rather than a constrained MCU
          # target. Its Rust and Cross support are Tier 2 and QEMU-capable; use
          # musl so the artifact has no glibc 2.36 floor.
          - target: loongarch64-unknown-linux-musl
            emulated_smoke: true

          # Build-only: nothing here can execute an illumos binary. The
          # omnios job builds and tests natively.
          - target: x86_64-unknown-illumos

          # The only big-endian target we build. Every binary parser here
          # reads multi-byte fields, and nothing else in this matrix would
          # catch a byte-order bug.
          - target: s390x-unknown-linux-gnu
            emulated_smoke: true

          - target: riscv64gc-unknown-linux-gnu

          - target: powerpc64le-unknown-linux-gnu


    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cross
          key: cargo-home-${{ matrix.target }}-${{ env.CROSS_REV }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-${{ matrix.target }}-

      # Cross 0.2.5 cannot provision LoongArch's Rust std, so install a
      # reviewed revision. The version check stops a stale cached binary from
      # silently winning.
      - name: Install cross
        run: |
          if ! cross --version 2>/dev/null | grep -q "${CROSS_REV:0:7}"; then
            cargo install cross --locked --force \
              --git https://github.com/cross-rs/cross --rev "$CROSS_REV"
          fi

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: cross build --locked --profile "$PROFILE" --target "$TARGET" --bin stng

      - name: Inspect
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: file "target/$TARGET/$PROFILE/stng"

      # A static musl binary runs on the runner as-is.
      - name: Smoke test
        if: matrix.smoke
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          "./target/$TARGET/$PROFILE/stng" --version
          "./target/$TARGET/$PROFILE/stng" --help >/dev/null

      # Cross supplies QEMU and the target sysroot for these architectures.
      # Running through `cross run` checks the loader, ISA and startup path;
      # `file` alone would only prove that the linker emitted some ELF bytes.
      - name: Emulated smoke test
        if: matrix.emulated_smoke
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          cross run --locked --profile "$PROFILE" --target "$TARGET" --bin stng -- --version
          cross run --locked --profile "$PROFILE" --target "$TARGET" --bin stng -- --help >/dev/null

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: tar -czf "stng-$TARGET.tar.gz" -C "target/$TARGET/$PROFILE" stng

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stng-${{ matrix.target }}
          path: stng-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
