# Lint and test on every push and PR, and build the `stng` binary for every
# platform we ship. The build matrix itself lives in build.yml, which release.yml
# also calls — one definition, so CI and release can't drift apart.
#
# Hardening notes — this workflow is itself a supply-chain target:
#
#   * Every action is pinned to a full commit SHA. Tags are mutable; a
#     compromised upstream can move `v4` at any time. .github/dependabot.yml
#     proposes the bumps so pinning doesn't mean going stale.
#   * `permissions: {}` at the top level. Each job opts in to exactly what it
#     needs; nothing here needs more than `contents: read`.
#   * `persist-credentials: false` on every checkout, so the job token is never
#     written into .git/config where a build script (we run hundreds) could
#     read it back out.
#   * Trigger is `pull_request`, never `pull_request_target`: fork PRs run with
#     a read-only token and no access to secrets. This workflow passes no
#     secrets to build.yml at all — CI artifacts get an ad-hoc macOS signature,
#     and the Developer ID identity is reachable only from release.yml.
#   * Every cargo invocation is `--locked`. Without it a compromised registry
#     could swap a dependency out from under a release build; Cargo.lock is
#     what pins each one to a reviewed version.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The emulated and VM-built platforms (build.yml's `slow` wave) take up to
  # 75 minutes and are best-effort, so they run nightly and on demand rather
  # than on every push.
  schedule:
    - cron: "17 6 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # Cheapest job, highest value. A `[patch]` entry pointing at a sibling
  # checkout is easy to commit by accident while a cross-repo change is in
  # flight. Shipping one would build a release nobody else can reproduce.
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject local path overrides
        run: scripts/check-overrides

      - name: Install toolchain
        run: |
          rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.97
          rustc --version --verbose

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Registry only, never target/: per-target build dirs would quickly
          # exhaust the 10 GB per-repo cache budget.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-home-guard-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-guard-${{ runner.os }}-

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.2

      # The same checks as a local `make lint`: rustfmt, clippy on the
      # workspace and on the library alone (no `cli` dependencies), rustdoc
      # with warnings denied, and unused dependencies.
      - run: make lint

      # A `--locked` build fails outright on a stale lockfile, but this catches
      # the subtler case of a lockfile that resolves but wasn't committed.
      - name: Cargo.lock unchanged
        run: git diff --exit-code Cargo.lock

  # Advisories, licences, banned crates and allowed sources (deny.toml).
  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup toolchain install 1.97 --profile minimal --no-self-update
          rustup default 1.97

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - run: cargo deny --locked check

  # Not gated on `guard`: serializing the builds behind clippy would only add
  # wall clock.
  build:
    name: build
    uses: ./.github/workflows/build.yml
    # A caller job sets the ceiling for the workflow it calls: with
    # `permissions: {}` up top and nothing declared here, build.yml's jobs are
    # capped at `contents: none` and the run is rejected before it starts.
    # Must stay >= the permissions build.yml's own jobs request.
    permissions:
      contents: read
    with:
      profile: release
      # `fast` for pushes and PRs; everything for the nightly and manual runs.
      # (An empty wave runs both; `'' || x` would always pick x, hence the inversion.)
      wave: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && 'fast' || '' }}
    # No secrets passed. CI never touches the signing identity.
