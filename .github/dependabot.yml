# Keeps the SHA-pinned actions and the Cargo dependencies current, one grouped
# PR a week for each. For actions, the `# vX.Y.Z` comment beside each pin is
# updated with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
